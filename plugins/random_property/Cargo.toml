[package]
name = "random_property_plugin"
version = "0.1.0"
edition = "2021"
license = "MIT"

# This plugin is intentionally outside the RuViE host workspace. Its code is
# neither compiled nor linked when an already-built RuViE host is produced.
[workspace]
resolver = "2"

[lib]
crate-type = ["cdylib"]

[dependencies]
ruvie-plugin-api = { path = "../../plugin-api" }
rand = "0.8.6"
serde_json = "1.0"
