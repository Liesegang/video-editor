# `catalog_status` is mandatory for every design entry. `native` entries are
# checked bidirectionally against the compiled catalog; `design-needed` entries
# may remain unimplemented, and `plugin-managed` entries mirror descriptors
# bundled with this binary. Runtime-discovered/third-party plugins are valid
# Project operations but intentionally stay outside this static first-party
# inventory. Native entries also declare a stable `catalog_id` and runtime
# status; plugin-managed entries declare their complete operation identity.

Expression:
  category: Scripting
  catalog_status: design-needed
  type: python
  description: Execute custom Python scripts
  inputs:
    - name: code
      type: String
      multiline: true
    - name: inputs
      type: List<Any>
  outputs:
    - name: result
      type: Any

