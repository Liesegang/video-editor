# `catalog_status` is mandatory for every design entry. `native` entries are
# checked bidirectionally against the compiled catalog; `design-needed` entries
# may remain unimplemented, and `plugin-managed` entries belong to the dynamic
# plugin descriptor registry. Native entries also declare a stable `catalog_id`
# and their current runtime status.

Expression:
  category: Scripting
  catalog_status: design-needed
  type: python
  description: Execute custom Python scripts
  inputs:
    - name: code
      type: String
      multiline: true
    - name: inputs
      type: List<Any>
  outputs:
    - name: result
      type: Any

