# --- Compositing ---
Shape Transform:
  category: Shape Operations / Transform
  catalog_status: design-needed
  operation_category: transform
  component_id: transform
  operation: transform.apply.v1
  description: Absolute spatial placement for a complete Shape value; opacity is owned by Style
  inputs:
    - name: position
      key: property:position
      label: Position
      type: Vector2
      side: Left
      exposure: Graph
      multiplicity: Single
      property: position
      property_metadata:
        ui_type: Vec2
        default: { x: 0.0, y: 0.0 }
        suffix: px
    - name: rotation
      key: property:rotation
      label: Rotation
      type: Number
      side: Left
      exposure: Graph
      multiplicity: Single
      property: rotation
      property_metadata:
        ui_type: Float
        default: 0.0
        min: -360.0
        max: 360.0
        step: 1.0
        suffix: deg
        min_hard_limit: false
        max_hard_limit: false
    - name: scale
      key: property:scale
      label: Scale
      type: Vector2
      side: Left
      exposure: Graph
      multiplicity: Single
      property: scale
      property_metadata:
        ui_type: Vec2
        default: { x: 100.0, y: 100.0 }
        min: 0.0
        max: 1000.0
        step: 0.1
        suffix: "%"
        min_hard_limit: true
        max_hard_limit: false
    - name: anchor
      key: property:anchor
      label: Anchor
      type: Vector2
      side: Left
      exposure: Graph
      multiplicity: Single
      property: anchor
      property_metadata:
        ui_type: Vec2
        default: { x: 0.0, y: 0.0 }
        suffix: px
    - name: time
      key: time
      label: Time
      type: Number
      side: Left
      exposure: Graph
      multiplicity: Single
    - name: shape
      key: shape_in
      label: Shape
      type: Shape
      side: Left
      exposure: Graph
      multiplicity: Single
  outputs:
    - name: shape
      key: shape
      label: Shape
      type: Shape
      side: Right
      exposure: Graph
      multiplicity: Single
