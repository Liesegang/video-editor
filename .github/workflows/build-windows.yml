name: Build and Publish Rust App for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.9"
          enable-cache: true

      - name: Set up pinned Rust and managed CPython
        shell: pwsh
        run: cargo run -p xtask -- bootstrap

      - name: Setup Visual Studio
        uses: microsoft/setup-msbuild@v1.3.1

      - name: Install vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          git -C vcpkg checkout b27651341123a59f7187b42ef2bc476284afb310
          Set-Location vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg integrate install
          .\vcpkg install "ffmpeg[ffmpeg,x264]:x64-windows"

      - name: Set up environment variables
        shell: pwsh
        run: |
          "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_TRIPLET=x64-windows" >> $env:GITHUB_ENV
          "RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $vulkanVersion = (Invoke-WebRequest -Uri "https://vulkan.lunarg.com/sdk/latest.json" | ConvertFrom-Json).windows
          $installerUrl = "https://sdk.lunarg.com/sdk/download/$vulkanVersion/windows/VulkanSDK-$vulkanVersion-Installer.exe"
          $installerPath = "$env:TEMP\VulkanSDK-$vulkanVersion-Installer.exe"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
          Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait -WindowStyle Hidden
          Remove-Item -LiteralPath $installerPath

      # The moving vcpkg checkout does not provide an exact OpenColorIO
      # runtime contract. Keep app/opencolorio disabled until a pinned runtime
      # and its DLLs are packaged and tested with the installer.
      - name: Publish Release (built-in color backend; no OpenColorIO runtime)
        shell: pwsh
        run: cargo run -p xtask -- publish

      - name: Upload Published Application
        uses: actions/upload-artifact@v4
        with:
          name: ruvie-windows-x86_64
          path: target/publish/windows-x86_64/RuViE/
