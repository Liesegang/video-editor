[workspace]
resolver = "3"

[package]
name = "clippy-policy-fixture"
version = "0.0.0"
edition = "2024"
publish = false

[features]
bad-allow-without-reason = []
bad-case-sensitive-extension = []
bad-dbg = []
bad-expect = []
bad-ignored-result = []
bad-large-stack-array = []
bad-large-value = []
bad-non-send-field = []
bad-panic = []
bad-redundant-clone = []
bad-string-slice = []
bad-todo = []
bad-undocumented-unsafe = []
bad-unimplemented = []
bad-unreachable = []
bad-unused-result-ok = []
bad-unwrap = []
bad-unwrap-in-result = []
