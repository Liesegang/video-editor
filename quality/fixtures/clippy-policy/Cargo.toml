[workspace]
resolver = "3"

[package]
name = "clippy-policy-fixture"
version = "0.0.0"
edition = "2024"
publish = false

[features]
bad-allow-without-reason = []
bad-case-sensitive-extension = []
bad-cast-ptr-alignment = []
bad-cfg-not-test = []
bad-dbg = []
bad-exit = []
bad-expect = []
bad-fallible-impl-from = []
bad-fn-to-numeric-cast-any = []
bad-ignored-result = []
bad-large-stack-array = []
bad-large-value = []
bad-non-send-field = []
bad-panic = []
bad-path-buf-push-overwrite = []
bad-redundant-clone = []
bad-string-slice = []
bad-todo = []
bad-transmute-ptr-to-ptr = []
bad-transmute-undefined-repr = []
bad-undocumented-unsafe = []
bad-unimplemented = []
bad-unreachable = []
bad-unused-result-ok = []
bad-unwrap = []
bad-unwrap-in-result = []
