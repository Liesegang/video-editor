[package]
name = "library"
version = "0.1.0"
edition = "2024"
description = "Core library for video editor."
license = "MIT"

[lints]
workspace = true

[features]
default = ["gl"]
gl = []
opencolorio = ["ruvie-color-management/opencolorio"]

[dependencies]
ruvie-color-management = { version = "0.1.0", path = "../color-management" }
ruvie-plugin-api = { version = "0.1.0", path = "../plugin-api" }
ruvie-python-runtime = { version = "0.1.0", path = "../python-runtime" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
ffmpeg-next = "8.1.0"
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "tga",
    "tiff",
    "webp",
] }
png = "0.18.1"
skia-safe = { version = "0.91.0", features = ["gpu", "gl", "textlayout"] }

log = "0.4.26"
lru = "0.16.3"
ordered-float = { version = "5.1.0", features = ["serde"] }
sha2 = "0.10"
libloading = "0.9"
glutin = "0.32.3"
glow = "0.16"
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL"
] }
thiserror = "2.0"
rayon = "1.9.0"
uuid = { version = "1.19.0", features = ["serde", "v4"] }
#opencv = "0.94.2"

toml = "0.9.8"
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
rtrb = "0.3"
anyhow = "1.0.103"
bytemuck = { version = "1.25.1", features = ["extern_crate_alloc"] }
half = "2.7.1"
libc = "0.2"
unicode-segmentation = "1.12"
ufbx = "=0.11.3"

[dev-dependencies]
env_logger = "0.11"
tempfile = "3.27"

[[bench]]
name = "production_baseline"
harness = false
